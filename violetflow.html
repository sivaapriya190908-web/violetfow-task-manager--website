<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VioletFlow — Organize your thoughts. Prioritize your world.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#050505;
  --grape:#2A0A35;
  --violet:#32174D;
  --fuchsia:#4A003D;
  --pewter:#25252A;
  --shell:#FFF5F5;
  --muted:#b3a3bd;
  --glow:#a855c9;
  --glow-soft:rgba(168,85,201,0.35);
  --high:#e0558f;
  --med:#c98a3d;
  --low:#4fb0a5;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --font-head:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--black);
  color:var(--shell);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--glow-soft);color:var(--shell);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
.scrollbar-hide::-webkit-scrollbar{width:6px;}
.scrollbar-hide::-webkit-scrollbar-thumb{background:var(--fuchsia);border-radius:8px;}
#root{min-height:100vh;}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.btn{
  font-family:var(--font-head);
  font-weight:600;
  font-size:15px;
  padding:13px 26px;
  border-radius:999px;
  border:none;
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:linear-gradient(135deg,var(--fuchsia),var(--glow) 140%);
  color:var(--shell);
  box-shadow:0 8px 28px -8px var(--glow-soft);
}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 10px 34px -6px var(--glow-soft);}
.btn-ghost{
  background:transparent;
  color:var(--shell);
  border:1.5px solid rgba(255,245,245,0.18);
}
.btn-ghost:hover{border-color:rgba(255,245,245,0.4);background:rgba(255,245,245,0.04);}
.btn-sm{padding:9px 18px;font-size:13px;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,245,245,0.06);
  color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{background:rgba(255,245,245,0.12);color:var(--shell);}
svg{display:block;}

/* ================= LANDING ================= */
.landing{
  min-height:100vh;
  display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(74,0,61,0.55), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(50,23,77,0.6), transparent 55%),
    linear-gradient(180deg,var(--black) 0%, var(--grape) 100%);
  position:relative;
  overflow:hidden;
}
.landing-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:28px 6vw;position:relative;z-index:3;
}
.wordmark{font-family:var(--font-head);font-weight:700;font-size:22px;letter-spacing:0.2px;display:flex;align-items:center;gap:10px;}
.wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 14px 3px var(--glow-soft);}
.landing-nav .navlinks{display:flex;gap:14px;}
.landing-hero{
  flex:1;display:flex;align-items:center;gap:64px;
  padding:20px 6vw 60px;position:relative;z-index:2;
  max-width:1320px;margin:0 auto;width:100%;
}
.landing-copy{flex:1;min-width:280px;}
.eyebrow-quote{
  font-family:var(--font-head);font-size:15px;color:var(--muted);
  border-left:2px solid var(--fuchsia);padding-left:14px;margin-bottom:28px;
  max-width:340px;line-height:1.5;
}
.landing-copy h1{
  font-family:var(--font-head);font-weight:700;
  font-size:clamp(40px,6vw,72px);line-height:1.03;letter-spacing:-1px;
  margin-bottom:22px;
}
.landing-copy h1 .grad{
  background:linear-gradient(120deg,var(--shell),var(--glow) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.landing-copy p.sub{
  font-size:18px;color:var(--muted);max-width:460px;line-height:1.6;margin-bottom:38px;
}
.landing-actions{display:flex;gap:14px;flex-wrap:wrap;}
.landing-visual{flex:1;min-width:300px;display:flex;align-items:center;justify-content:center;}
.floating-cards{position:relative;width:100%;max-width:440px;aspect-ratio:1/0.95;}
.fcard{
  position:absolute;border-radius:16px;padding:16px 18px;width:220px;
  background:linear-gradient(160deg,rgba(50,23,77,0.9),rgba(37,37,42,0.9));
  border:1px solid rgba(255,245,245,0.09);
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
  backdrop-filter:blur(6px);
  animation:float 7s ease-in-out infinite;
}
.fcard .tag{font-size:10px;font-weight:600;letter-spacing:.4px;color:var(--high);margin-bottom:8px;font-family:var(--font-head);}
.fcard .tag.med{color:var(--med);}
.fcard .tag.low{color:var(--low);}
.fcard .ttl{font-size:14px;font-weight:600;color:var(--shell);margin-bottom:5px;}
.fcard .meta{font-size:11px;color:var(--muted);}
.fcard.c1{top:6%;left:2%;animation-delay:0s;}
.fcard.c2{top:38%;right:0;animation-delay:1.6s;width:200px;}
.fcard.c3{bottom:4%;left:14%;animation-delay:3.2s;}
@keyframes float{0%,100%{transform:translateY(0px);}50%{transform:translateY(-14px);}}
.orbit-particles{position:absolute;inset:0;pointer-events:none;}
.orbit-particles span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--glow);opacity:.6;box-shadow:0 0 8px 2px var(--glow-soft);}

/* ================= AUTH ================= */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 900px 600px at 50% 0%, rgba(74,0,61,0.5), transparent 60%), var(--black);
  padding:24px;
}
.auth-card{
  width:100%;max-width:420px;
  background:linear-gradient(165deg,rgba(50,23,77,0.55),rgba(37,37,42,0.55));
  border:1px solid rgba(255,245,245,0.08);
  border-radius:var(--radius-lg);
  padding:38px 34px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,0.8);
}
.auth-card .wordmark{justify-content:center;margin-bottom:6px;}
.auth-card h2{
  font-family:var(--font-head);text-align:center;font-size:24px;font-weight:600;margin:14px 0 6px;
}
.auth-card p.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500;}
.field input{
  width:100%;padding:12px 14px;border-radius:11px;
  background:rgba(5,5,5,0.4);border:1px solid rgba(255,245,245,0.12);
  color:var(--shell);font-size:14.5px;transition:border-color .15s;
}
.field input:focus{border-color:var(--glow);}
.field input::placeholder{color:rgba(179,163,189,0.6);}
.auth-error{
  background:rgba(224,85,143,0.12);border:1px solid rgba(224,85,143,0.35);color:#f3a9c4;
  font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;
}
.auth-card .btn{width:100%;margin-top:6px;}
.auth-switch{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted);}
.auth-switch button{background:none;border:none;color:var(--glow);font-weight:600;font-size:13.5px;}
.auth-back{margin-bottom:18px;}

/* ================= APP SHELL ================= */
.shell{display:flex;min-height:100vh;background:var(--black);}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(180deg,var(--grape),var(--black) 85%);
  border-right:1px solid rgba(255,245,245,0.06);
  display:flex;flex-direction:column;
  padding:24px 16px;
  position:sticky;top:0;height:100vh;
}
.sidebar .wordmark{padding:0 8px;margin-bottom:34px;}
.navlist{display:flex;flex-direction:column;gap:4px;flex:1;}
.navitem{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
  color:var(--muted);font-size:14.5px;font-weight:500;transition:.15s;
}
.navitem svg{width:18px;height:18px;flex-shrink:0;}
.navitem:hover{background:rgba(255,245,245,0.05);color:var(--shell);}
.navitem.active{
  background:linear-gradient(135deg,rgba(74,0,61,0.7),rgba(74,0,61,0.25));
  color:var(--shell);box-shadow:inset 0 0 0 1px rgba(168,85,201,0.3);
}
.sidebar-foot{
  border-top:1px solid rgba(255,245,245,0.08);padding-top:16px;margin-top:12px;
  display:flex;align-items:center;gap:10px;padding-left:8px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--fuchsia),var(--glow));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:14px;
  flex-shrink:0;
}
.sidebar-foot .who{flex:1;min-width:0;}
.sidebar-foot .who .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-foot .who .out{font-size:11.5px;color:var(--muted);background:none;border:none;padding:0;}
.sidebar-foot .who .out:hover{color:var(--high);}

.main{flex:1;min-width:0;padding:32px 40px 100px;max-width:1320px;}
.topbar-mobile{display:none;}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
.page-head h1{font-family:var(--font-head);font-size:30px;font-weight:700;}
.page-head p{color:var(--muted);font-size:14.5px;margin-top:6px;}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:34px;}
.stat-card{
  background:linear-gradient(160deg,var(--violet),var(--pewter) 160%);
  border:1px solid rgba(255,245,245,0.07);border-radius:var(--radius-md);
  padding:20px 20px;position:relative;overflow:hidden;
}
.stat-card .label{font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--muted);margin-bottom:10px;}
.stat-card .value{font-family:var(--font-head);font-size:32px;font-weight:700;}
.stat-card.accent{background:linear-gradient(160deg,var(--fuchsia),var(--violet) 160%);}
.stat-card .glow{position:absolute;width:90px;height:90px;border-radius:50%;background:var(--glow-soft);filter:blur(30px);top:-30px;right:-20px;opacity:.5;}

/* quote & insight row */
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:34px;}
.card-panel{
  background:linear-gradient(160deg,var(--violet),var(--pewter) 180%);
  border:1px solid rgba(255,245,245,0.07);border-radius:var(--radius-lg);
  padding:26px 26px;
}
.quote-card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:150px;}
.quote-card .kicker{font-family:var(--font-head);font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.quote-card blockquote{font-family:var(--font-head);font-size:22px;line-height:1.4;font-weight:500;color:var(--shell);max-width:520px;}
.moon-svg{position:absolute;right:-10px;top:-10px;opacity:.9;}
.insight-card .kicker{font-family:var(--font-head);font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.insight-card p{font-size:15.5px;line-height:1.55;color:var(--shell);}

/* focus now */
.focus-panel{
  background:linear-gradient(120deg,var(--fuchsia),var(--grape) 120%);
  border-radius:var(--radius-lg);padding:28px 30px;margin-bottom:34px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  border:1px solid rgba(168,85,201,0.25);position:relative;overflow:hidden;
}
.focus-panel::before{content:"";position:absolute;width:260px;height:260px;background:var(--glow-soft);filter:blur(60px);border-radius:50%;top:-90px;right:-60px;}
.focus-left{position:relative;z-index:1;}
.focus-kicker{font-family:var(--font-head);font-weight:600;font-size:13px;letter-spacing:.4px;color:var(--glow);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.focus-kicker .pulse{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 3px var(--glow-soft);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.focus-title{font-family:var(--font-head);font-size:22px;font-weight:600;margin-bottom:6px;}
.focus-meta{font-size:13.5px;color:var(--muted);}
.focus-empty{font-size:15px;color:var(--muted);}

/* empty state */
.empty-state{
  text-align:center;padding:60px 20px;border-radius:var(--radius-lg);
  background:linear-gradient(165deg,var(--violet),var(--black) 170%);
  border:1px solid rgba(255,245,245,0.06);
}
.empty-state h3{font-family:var(--font-head);font-size:22px;font-weight:600;margin:22px 0 8px;}
.empty-state p{color:var(--muted);font-size:14.5px;margin-bottom:22px;}

/* priorities section */
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title h2{font-family:var(--font-head);font-size:19px;font-weight:600;}
.priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:34px;}
.pcol{
  background:rgba(255,245,245,0.02);border:1px dashed rgba(255,245,245,0.1);
  border-radius:var(--radius-md);padding:14px;min-height:140px;transition:.15s;
}
.pcol.dragover{border-color:var(--glow);background:rgba(168,85,201,0.06);}
.pcol-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 4px;}
.pcol-dot{width:9px;height:9px;border-radius:50%;}
.pcol-dot.high{background:var(--high);}
.pcol-dot.medium{background:var(--med);}
.pcol-dot.low{background:var(--low);}
.pcol-head span{font-family:var(--font-head);font-size:13px;font-weight:600;}
.pcol-head small{color:var(--muted);font-size:12px;margin-left:auto;}
.pcol-empty{font-size:12.5px;color:var(--muted);padding:16px 6px;text-align:center;}

/* task card */
.task-card{
  background:var(--violet);border:1px solid rgba(255,245,245,0.06);
  border-radius:var(--radius-sm);padding:14px 14px;margin-bottom:10px;cursor:grab;
  transition:transform .15s, box-shadow .15s, opacity .3s;
}
.task-card:hover{box-shadow:0 10px 24px -12px rgba(0,0,0,0.6);}
.task-card.dragging{opacity:.4;}
.task-card.completed{opacity:.5;}
.task-card.completed .t-title{text-decoration:line-through;}
.task-row{display:flex;align-items:flex-start;gap:10px;}
.checkbox{
  width:19px;height:19px;border-radius:6px;border:1.5px solid rgba(255,245,245,0.3);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:.15s;background:transparent;
}
.checkbox.checked{background:linear-gradient(135deg,var(--fuchsia),var(--glow));border-color:transparent;}
.checkbox svg{width:11px;height:11px;opacity:0;transition:.15s;}
.checkbox.checked svg{opacity:1;}
.t-body{flex:1;min-width:0;}
.t-title{font-size:14.5px;font-weight:600;margin-bottom:3px;}
.t-desc{font-size:12.5px;color:var(--muted);margin-bottom:8px;line-height:1.4;}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.2px;}
.pill.high{background:rgba(224,85,143,0.15);color:var(--high);}
.pill.medium{background:rgba(201,138,61,0.15);color:var(--med);}
.pill.low{background:rgba(79,176,165,0.15);color:var(--low);}
.pill.cat{background:rgba(255,245,245,0.07);color:var(--muted);}
.pill.due{background:rgba(255,245,245,0.05);color:var(--muted);}
.pill.due.overdue{background:rgba(224,85,143,0.15);color:var(--high);}
.pill.tag{background:rgba(168,85,201,0.12);color:var(--glow);}
.t-actions{display:flex;gap:4px;flex-shrink:0;}
.t-actions button{width:28px;height:28px;border-radius:8px;background:transparent;border:none;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.t-actions button:hover{background:rgba(255,245,245,0.08);color:var(--shell);}
.t-actions button.danger:hover{color:var(--high);}
.t-actions svg{width:15px;height:15px;}

/* task creation micro-anim */
@keyframes taskIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.task-card.enter{animation:taskIn .35s ease;}
@keyframes checkPop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
.checkbox.pop{animation:checkPop .3s ease;}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.search-box{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
  background:rgba(255,245,245,0.05);border:1px solid rgba(255,245,245,0.08);
  border-radius:11px;padding:10px 14px;
}
.search-box svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.search-box input{flex:1;background:none;border:none;color:var(--shell);font-size:14px;}
.search-box input::placeholder{color:var(--muted);}
select.select-pill, .select-pill{
  background:rgba(255,245,245,0.05);border:1px solid rgba(255,245,245,0.1);
  color:var(--shell);border-radius:11px;padding:10px 14px;font-size:13.5px;
}
.tabbar{display:flex;gap:6px;background:rgba(255,245,245,0.04);padding:4px;border-radius:11px;width:fit-content;}
.tabbar button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;}
.tabbar button.active{background:linear-gradient(135deg,var(--fuchsia),var(--violet));color:var(--shell);}
.task-list{display:flex;flex-direction:column;gap:10px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,5,5,0.7);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(165deg,var(--violet),var(--pewter) 200%);
  border:1px solid rgba(255,245,245,0.1);border-radius:var(--radius-lg);
  padding:28px 28px 26px;
  animation:modalIn .25s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-head h3{font-family:var(--font-head);font-size:19px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--muted);width:30px;height:30px;border-radius:8px;}
.modal-close:hover{background:rgba(255,245,245,0.08);color:var(--shell);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.chip-select{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;
  border:1.5px solid rgba(255,245,245,0.12);color:var(--muted);background:transparent;
}
.chip.sel-high.active{border-color:var(--high);color:var(--high);background:rgba(224,85,143,0.1);}
.chip.sel-medium.active{border-color:var(--med);color:var(--med);background:rgba(201,138,61,0.1);}
.chip.sel-low.active{border-color:var(--low);color:var(--low);background:rgba(79,176,165,0.1);}
.chip.cat-chip.active{border-color:var(--glow);color:var(--glow);background:rgba(168,85,201,0.12);}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:rgba(5,5,5,0.4);border:1px solid rgba(255,245,245,0.12);border-radius:11px;}
.tag-chip{background:rgba(168,85,201,0.15);color:var(--glow);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;}
.tag-chip button{background:none;border:none;color:var(--glow);font-size:13px;line-height:1;}
.tag-input-wrap input{flex:1;min-width:80px;background:none;border:none;color:var(--shell);font-size:13.5px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
textarea{width:100%;padding:12px 14px;border-radius:11px;background:rgba(5,5,5,0.4);border:1px solid rgba(255,245,245,0.12);color:var(--shell);font-size:14px;resize:vertical;min-height:64px;}

/* focus mode */
.focus-overlay{
  position:fixed;inset:0;background:radial-gradient(ellipse 900px 600px at 50% 20%, rgba(74,0,61,0.7), transparent 60%), var(--black);
  z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;
  animation:fadeIn .3s ease;
}
.focus-overlay .fm-close{position:absolute;top:24px;right:28px;}
.fm-kicker{font-family:var(--font-head);color:var(--glow);font-size:13px;letter-spacing:.4px;margin-bottom:18px;}
.fm-title{font-family:var(--font-head);font-size:clamp(26px,4vw,42px);font-weight:700;text-align:center;max-width:720px;margin-bottom:14px;}
.fm-desc{color:var(--muted);text-align:center;max-width:520px;margin-bottom:40px;line-height:1.6;}
.timer-ring{position:relative;width:230px;height:230px;margin-bottom:34px;}
.timer-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
.timer-ring .bg{fill:none;stroke:rgba(255,245,245,0.08);stroke-width:6;}
.timer-ring .fg{fill:none;stroke:url(#tgrad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-text .time{font-family:var(--font-head);font-size:40px;font-weight:700;}
.timer-text .label{font-size:12px;color:var(--muted);margin-top:4px;}
.fm-actions{display:flex;gap:12px;}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-nav h2{font-family:var(--font-head);font-size:19px;font-weight:600;min-width:170px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-dow{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:6px;font-weight:600;}
.cal-cell{
  aspect-ratio:1/0.85;border-radius:12px;background:rgba(255,245,245,0.02);

  display:flex;flex-direction:column;
}
.cal-cell:hover{background:rgba(255,245,245,0.05);}
.cal-cell.empty{background:none;border:none;cursor:default;}
.cal-cell.today{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow) inset;}
.cal-cell .dnum{font-size:13px;font-weight:600;margin-bottom:4px;}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;}
.cal-dot{width:6px;height:6px;border-radius:50%;}
.cal-list-view .task-list{margin-top:6px;}

/* analytics */
.analytics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-row .lbl{width:90px;font-size:12.5px;color:var(--muted);flex-shrink:0;}
.bar-track{flex:1;height:9px;border-radius:6px;background:rgba(255,245,245,0.06);overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--fuchsia),var(--glow));}
.bar-row .num{font-size:12.5px;color:var(--muted);width:28px;text-align:right;flex-shrink:0;}
.weekbars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:10px;}

.streak-num{font-family:var(--font-head);font-size:44px;font-weight:700;}

/* categories page */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.cat-tile{

.cat-tile .name{font-family:var(--font-head);font-weight:600;font-size:15px;}

.add-cat-tile{
  border:1.5px dashed rgba(255,245,245,0.15);border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);

}

/* settings */
.settings-grid{display:flex;flex-direction:column;gap:16px;max-width:560px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--violet);border:1px solid rgba(255,245,245,0.06);border-radius:var(--radius-md);}
.settings-row .t{font-size:14.5px;font-weight:600;}
.settings-row .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
.toggle{width:42px;height:24px;border-radius:999px;background:rgba(255,245,245,0.12);position:relative;border:none;flex-shrink:0;transition:.15s;}
.toggle.on{background:linear-gradient(135deg,var(--fuchsia),var(--glow));}
.toggle .dot{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--shell);transition:.2s;}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--pewter);border:1px solid rgba(255,245,245,0.12);color:var(--shell);

}

/* mobile bottom nav */
.bottom-nav{

.fab{

  align-items:center;justify-content:center;box-shadow:0 14px 30px -8px var(--glow-soft);z-index:80;

/* responsive */
@media (max-width:1023px){
  .sidebar{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,0.6);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:20px 20px 100px;}
  .topbar-mobile{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}

}
@media (max-width:640px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .form-row{grid-template-columns:1fr;}
  .landing-hero{flex-direction:column;text-align:center;padding-top:10px;}
  .eyebrow-quote{margin-left:auto;margin-right:auto;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}

</head>
<body>
<div id="root"></div>

<script>
(function(){
"use strict";

/* ============================================================
   STORAGE HELPERS
   ============================================================ */
const DB = {
  users(){ return JSON.parse(localStorage.getItem('vf_users')||'{}'); },
  saveUsers(u){ localStorage.setItem('vf_users', JSON.stringify(u)); },
  session(){ return localStorage.getItem('vf_session'); },
  setSession(username){ if(username) localStorage.setItem('vf_session', username); else localStorage.removeItem('vf_session'); },
  tasks(username){ try{ return JSON.parse(localStorage.getItem('vf_tasks_'+username)||'[]'); }catch(e){ return []; } },
  saveTasks(username, tasks){ localStorage.setItem('vf_tasks_'+username, JSON.stringify(tasks)); },
  cats(username){ try{ return JSON.parse(localStorage.getItem('vf_cats_'+username)||'null') || ['Personal','Work','Project','Shopping','College','Creative','Other']; }catch(e){ return ['Personal','Work','Project','Shopping','College','Creative','Other']; } },
  saveCats(username, cats){ localStorage.setItem('vf_cats_'+username, JSON.stringify(cats)); },
  settings(username){ try{ return JSON.parse(localStorage.getItem('vf_settings_'+username)||'null') || {reduceMotion:false, focusSound:true}; }catch(e){ return {reduceMotion:false, focusSound:true}; } },
  saveSettings(username, s){ localStorage.setItem('vf_settings_'+username, JSON.stringify(s)); }
};

/* ============================================================
   STATE
   ============================================================ */
const state = {
  view: 'landing',       // landing | auth | app
  authMode: 'signin',    // signin | signup
  authError: '',
  currentUser: null,     // {username,email,name}
  page: 'dashboard',     // dashboard | tasks | calendar | analytics | categories | settings
  tasks: [],
  categories: [],
  settings: {},
  taskFilter: 'all',     // all | active | completed
  taskSearch: '',
  taskSort: 'priority',
  taskCategoryFilter: 'all',
  sidebarOpen: false,
  modal: null,           // {type:'task', editingId:null, prefillDate:null} | null
  focusTaskId: null,
  calView: 'month',
  calCursor: (()=>{const d=new Date();d.setDate(1);return d;})(),
  quoteIndex: Math.floor(Math.random()*8),
  timer: {running:false, seconds:25*60, total:25*60, interval:null}
};

const QUOTES = [
  "Small progress is still progress.",
  "Focus on what matters, one task at a time.",
  "The secret of getting ahead is getting started.",
  "Clarity comes from action, not thought.",
  "Done is better than perfect.",
  "Your future is built in small, quiet moments like this one.",
  "One task, fully finished, beats five half-started.",
  "Momentum is made of tiny decisions."
];

/* ============================================================
   UTILITIES
   ============================================================ */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase() || name[0].toUpperCase();
}
function getGreeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good night';
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  if(h < 21) return 'Good evening';
  return 'Good night';
}
function fmtDate(dstr){
  if(!dstr) return '';
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  const hh = h%12===0?12:h%12;
  return `${hh}:${String(m).padStart(2,'0')} ${ap}`;
}
function isOverdue(task){
  if(!task.dueDate || task.completed) return false;
  return task.dueDate < todayStr();
}
function isDueToday(task){
  return task.dueDate === todayStr();
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2400);
}

/* ============================================================
   COMPUTED DATA
   ============================================================ */
function computeStats(tasks){
  const total = tasks.length;
  const completed = tasks.filter(t=>t.completed).length;
  const dueToday = tasks.filter(t=>!t.completed && isDueToday(t)).length;
  const highPriority = tasks.filter(t=>!t.completed && t.priority==='high').length;
  const productivity = total ? Math.round((completed/total)*100) : 0;
  return {total, completed, dueToday, highPriority, productivity};
}
function computeInsight(tasks){
  if(tasks.length===0) return "Your productivity journey begins with your first task.";
  const overdue = tasks.filter(isOverdue).length;
  const completed = tasks.filter(t=>t.completed).length;
  const active = tasks.filter(t=>!t.completed);
  const highActive = active.filter(t=>t.priority==='high').length;
  if(overdue>0) return `You have ${overdue} overdue ${overdue===1?'task':'tasks'} that may need attention.`;
  if(active.length>0 && highActive/active.length >= 0.5) return "You have several high-priority tasks. Consider focusing on the most urgent one first.";
  if(completed>0) return `You've completed ${completed} ${completed===1?'task':'tasks'}. Keep the momentum going.`;
  return "Start checking off tasks to see your productivity insight here.";
}
function computeStreak(tasks){
  const completedDates = new Set(
    tasks.filter(t=>t.completed && t.completedAt).map(t=>t.completedAt.slice(0,10))
  );
  if(completedDates.size===0) return 0;
  let streak = 0;
  let cursor = new Date();
  // if today has no completion, check if yesterday does to keep streak alive display-wise, but per spec: consecutive days ending today
  for(;;){
    const key = cursor.toISOString().slice(0,10);
    if(completedDates.has(key)){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    } else {
      if(streak===0 && key===todayStr()){
        // today not done yet, check yesterday onward
        cursor.setDate(cursor.getDate()-1);
        const yKey = cursor.toISOString().slice(0,10);
        if(completedDates.has(yKey)){ continue; }
      }
      break;
    }
  }
  return streak;
}
function focusPick(tasks){
  const active = tasks.filter(t=>!t.completed);
  if(active.length===0) return null;
  const weight = p => p==='high'?0:p==='medium'?1:2;
  return active.slice().sort((a,b)=>{
    const ao = isOverdue(a)?0:1, bo = isOverdue(b)?0:1;
    if(ao!==bo) return ao-bo;
    const wp = weight(a.priority)-weight(b.priority);
    if(wp!==0) return wp;
    const ad = a.dueDate||'9999', bd = b.dueDate||'9999';
    if(ad!==bd) return ad<bd?-1:1;
    return a.createdAt<b.createdAt?-1:1;
  })[0];
}

/* ============================================================
   PERSISTENCE ACTIONS
   ============================================================ */
function persistTasks(){ DB.saveTasks(state.currentUser.username, state.tasks); }
function persistCats(){ DB.saveCats(state.currentUser.username, state.categories); }
function persistSettings(){ DB.saveSettings(state.currentUser.username, state.settings); }

/* ============================================================
   ICONS
   ============================================================ */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  analytics:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  categories:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09A1.7 1.7 0 008.1 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 008.1 4.6a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--shell)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="var(--glow)" stroke="none"><path d="M12 2c1 3-2 4-2 7a4 4 0 108 0c0-1-.5-2-1-2 1 4-1 5-2 5a3 3 0 01-3-3c0-2 2-3 2-5-2 0-4 2-4 6a5 5 0 0010 0c0-5-4-6-8-8z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L3 14h7l-1 8 11-14h-7l0-6z"/></svg>'
};

/* ============================================================
   RENDER: ROUTER
   ============================================================ */
function render(){
  const root = document.getElementById('root');
  if(state.view==='landing') root.innerHTML = renderLanding();
  else if(state.view==='auth') root.innerHTML = renderAuth();
  else if(state.view==='app') root.innerHTML = renderApp();
  attachGlobalListeners();
}

/* ---------------- LANDING ---------------- */
function renderLanding(){
  let particles = '';
  for(let i=0;i<14;i++){
    const top = Math.random()*100, left = Math.random()*100, delay = (Math.random()*4).toFixed(1);
    particles += `<span style="top:${top}%;left:${left}%;animation:pulse ${2+Math.random()*3}s ${delay}s infinite;"></span>`;
  }
  return `
  <div class="landing">
    <div class="orbit-particles">${particles}</div>
    <nav class="landing-nav">
      <div class="wordmark"><span class="dot"></span>VioletFlow</div>
      <div class="navlinks">
        <button class="btn btn-ghost btn-sm" data-action="go-auth" data-mode="signin">Sign In</button>
      </div>
    </nav>
    <div class="landing-hero">
      <div class="landing-copy">
        <div class="eyebrow-quote">"${QUOTES[state.quoteIndex]}"</div>
        <h1>Organize your <span class="grad">thoughts.</span><br>Prioritize your world.</h1>
        <p class="sub">A calmer place to plan your day — capture tasks, sort them by what matters, and watch your focus turn into finished work.</p>
        <div class="landing-actions">
          <button class="btn btn-primary" data-action="go-auth" data-mode="signup">Create Account</button>
          <button class="btn btn-ghost" data-action="go-auth" data-mode="signin">Sign In</button>
        </div>

/* ---------------- TASKS PAGE ---------------- */
function renderTasksPage(){
  let list = state.tasks.slice();
  const cats = ['all', ...state.categories];

  if(state.taskFilter==='active') list = list.filter(t=>!t.completed);
  if(state.taskFilter==='completed') list = list.filter(t=>t.completed);
  if(state.taskCategoryFilter!=='all') list = list.filter(t=>t.category===state.taskCategoryFilter);
  if(state.taskSearch.trim()){
    const q = state.taskSearch.trim().toLowerCase();
    list = list.filter(t =>
      t.title.toLowerCase().includes(q) ||
      (t.description||'').toLowerCase().includes(q) ||
      t.category.toLowerCase().includes(q) ||
      (t.tags||[]).some(tg=>tg.toLowerCase().includes(q))
    );
  }
  const weight = p => p==='high'?0:p==='medium'?1:2;
  if(state.taskSort==='priority') list.sort((a,b)=>weight(a.priority)-weight(b.priority));
  else if(state.taskSort==='due') list.sort((a,b)=>(a.dueDate||'9999')<(b.dueDate||'9999')?-1:1);
  else if(state.taskSort==='recent') list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  else if(state.taskSort==='alpha') list.sort((a,b)=>a.title.localeCompare(b.title));

  const noResults = state.tasks.length>0 && list.length===0;

  return `
  <div class="page-head">
    <div><h1>My Tasks</h1><p>Every task you're tracking, in one focused view.</p></div>
    <button class="btn btn-primary" data-action="open-add-task">${ICONS.plus} Add Task</button>
  </div>

  <div class="toolbar">
    <div class="search-box">${ICONS.search}<input id="task-search" type="text" placeholder="Search your tasks..." value="${escapeHtml(state.taskSearch)}"></div>
    <select class="select-pill" id="cat-filter">
      ${cats.map(c=>`<option value="${c}" ${state.taskCategoryFilter===c?'selected':''}>${c==='all'?'All categories':c}</option>`).join('')}
    </select>
    <select class="select-pill" id="sort-select">
      <option value="priority" ${state.taskSort==='priority'?'selected':''}>Sort: Priority</option>
      <option value="due" ${state.taskSort==='due'?'selected':''}>Sort: Due date</option>
      <option value="recent" ${state.taskSort==='recent'?'selected':''}>Sort: Recently created</option>
      <option value="alpha" ${state.taskSort==='alpha'?'selected':''}>Sort: Alphabetical</option>
    </select>
  </div>
  <div class="tabbar" style="margin-bottom:20px;">
    <button data-action="set-filter" data-filter="all" class="${state.taskFilter==='all'?'active':''}">All</button>
    <button data-action="set-filter" data-filter="active" class="${state.taskFilter==='active'?'active':''}">Active</button>
    <button data-action="set-filter" data-filter="completed" class="${state.taskFilter==='completed'?'active':''}">Completed</button>
  </div>

  ${state.tasks.length===0 ? renderEmptyState() :
    noResults ? `<div class="empty-state"><h3>We couldn't find that task.</h3><p>Try another search or create a new task.</p></div>` :
    `<div class="task-list">${list.map(t=>renderTaskCard(t,false)).join('')}</div>`}
  `;
}

/* ---------------- CALENDAR PAGE ---------------- */
function renderCalendarPage(){
  const cursor = state.calCursor;
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const monthLabel = cursor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayKey = todayStr();

  const byDate = {};
  state.tasks.forEach(t=>{ if(t.dueDate){ (byDate[t.dueDate] = byDate[t.dueDate]||[]).push(t); } });

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks = byDate[key]||[];
    const dots = dayTasks.slice(0,4).map(t=>`<span class="cal-dot" style="background:var(--${t.priority==='high'?'high':t.priority==='medium'?'med':'low'})"></span>`).join('');
    cells += `<div class="cal-cell ${key===todayKey?'today':''}" data-action="cal-day" data-date="${key}">
      <div class="dnum">${d}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let extra = '';
  if(state.calView!=='month'){
    // week / day: show list of tasks within range
    let rangeStart, rangeEnd, label;
    if(state.calView==='day'){
      const d = todayKey; rangeStart=d; rangeEnd=d; label='Today';
    } else {
      const now = new Date(); const day=now.getDay();
      const start = new Date(now); start.setDate(now.getDate()-day);
      const end = new Date(start); end.setDate(start.getDate()+6);
      rangeStart = start.toISOString().slice(0,10); rangeEnd = end.toISOString().slice(0,10);
      label = 'This week';
    }
    const items = state.tasks.filter(t=>t.dueDate && t.dueDate>=rangeStart && t.dueDate<=rangeEnd);
    extra = `<div class="cal-list-view" style="margin-top:26px;">
      <div class="section-title"><h2>${label}'s tasks</h2></div>
      ${items.length===0 ? `<p style="color:var(--muted);font-size:14px;">No tasks scheduled.</p>` :
        `<div class="task-list">${items.map(t=>renderTaskCard(t,false)).join('')}</div>`}
    </div>`;
  }

  return `
  <div class="page-head"><div><h1>Calendar</h1><p>See your tasks laid out by date.</p></div></div>
  <div class="cal-head">
    <div class="cal-nav">
      <button class="icon-btn" data-action="cal-prev">${ICONS.chevL}</button>
      <h2>${monthLabel}</h2>
      <button class="icon-btn" data-action="cal-next">${ICONS.chevR}</button>
    </div>
    <div class="tabbar">
      <button data-action="cal-view" data-view="month" class="${state.calView==='month'?'active':''}">Month</button>
      <button data-action="cal-view" data-view="week" class="${state.calView==='week'?'active':''}">Week</button>
      <button data-action="cal-view" data-view="day" class="${state.calView==='day'?'active':''}">Day</button>
    </div>
  </div>
  <div class="cal-grid">
    ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells}
  </div>
  ${extra}
  `;
}

/* ---------------- ANALYTICS PAGE ---------------- */
function renderAnalyticsPage(){
  const tasks = state.tasks;
  if(tasks.length===0){
    return `
    <div class="page-head"><div><h1>Analytics</h1><p>Insight into how you get things done.</p></div></div>
    <div class="empty-state"><h3>Your analytics will appear here once you start creating tasks.</h3><p>Complete a few tasks and your insights will appear here.</p></div>`;
  }
  const stats = computeStats(tasks);
  const overdue = tasks.filter(isOverdue).length;
  const active = tasks.length - stats.completed;
  const priorityDist = {high:0,medium:0,low:0};
  tasks.forEach(t=> priorityDist[t.priority]++);
  const maxP = Math.max(1, ...Object.values(priorityDist));

  const catDist = {};
  tasks.forEach(t=> catDist[t.category] = (catDist[t.category]||0)+1 );
  const catEntries = Object.entries(catDist).sort((a,b)=>b[1]-a[1]);
  const maxC = Math.max(1, ...catEntries.map(e=>e[1]));

  // weekly productivity: last 7 days completed counts
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const weekCounts = days.map(d => tasks.filter(t=>t.completed && t.completedAt && t.completedAt.slice(0,10)===d).length);
  const maxW = Math.max(1, ...weekCounts);

  // monthly: last 4 weeks
  const monthBuckets = [0,0,0,0];
  tasks.forEach(t=>{
    if(t.completed && t.completedAt){
      const diffDays = Math.floor((new Date()-new Date(t.completedAt))/86400000);
      if(diffDays<7) monthBuckets[3]++;
      else if(diffDays<14) monthBuckets[2]++;
      else if(diffDays<21) monthBuckets[1]++;
      else if(diffDays<28) monthBuckets[0]++;
    }
  });
  const maxM = Math.max(1, ...monthBuckets);
  const streak = computeStreak(tasks);
  const dowLabels = days.map(d => new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'}));

  return `
  <div class="page-head"><div><h1>Analytics</h1><p>Insight into how you get things done.</p></div></div>

  <div class="analytics-grid">
    <div class="stat-card"><div class="label">TOTAL TASKS</div><div class="value">${tasks.length}</div></div>
    <div class="stat-card"><div class="label">COMPLETED</div><div class="value">${stats.completed}</div></div>
    <div class="stat-card"><div class="label">ACTIVE</div><div class="value">${active}</div></div>
    <div class="stat-card accent"><div class="label">OVERDUE</div><div class="value">${overdue}</div></div>
  </div>

  <div class="two-col">
    <div class="card-panel">
      <div class="section-title"><h2>Priority Distribution</h2><span style="color:var(--muted);font-size:13px;">${stats.productivity}% complete</span></div>
      ${['high','medium','low'].map(p=>`
        <div class="bar-row">
          <div class="lbl">${p.charAt(0).toUpperCase()+p.slice(1)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(priorityDist[p]/maxP)*100}%;background:${p==='high'?'linear-gradient(90deg,#4A003D,var(--high))':p==='medium'?'linear-gradient(90deg,#4A003D,var(--med))':'linear-gradient(90deg,#4A003D,var(--low))'}"></div></div>
          <div class="num">${priorityDist[p]}</div>
        </div>`).join('')}
    </div>
    <div class="card-panel">
      <div class="section-title"><h2>Category Distribution</h2></div>
      ${catEntries.map(([c,n])=>`
        <div class="bar-row">
          <div class="lbl">${escapeHtml(c)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(n/maxC)*100}%;"></div></div>
          <div class="num">${n}</div>
        </div>`).join('')}
    </div>
  </div>

  <div class="two-col">
    <div class="card-panel">
      <div class="section-title"><h2>Weekly Productivity</h2></div>
      <div class="weekbars">
        ${weekCounts.map((c,i)=>`<div class="wb"><div class="col" style="height:${(c/maxW)*90+ (c>0?10:2)}px;"></div><div class="dlabel">${dowLabels[i]}</div></div>`).join('')}
      </div>
    </div>
    <div class="card-panel">
      <div class="section-title"><h2>Monthly Productivity</h2></div>
      <div class="weekbars">
        ${monthBuckets.map((c,i)=>`<div class="wb"><div class="col" style="height:${(c/maxM)*90+(c>0?10:2)}px;"></div><div class="dlabel">Wk ${i+1}</div></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card-panel">
    <div class="section-title"><h2>Your Streak</h2></div>
    <div class="streak-flame">
      <div style="width:44px;height:44px;">${ICONS.flame}</div>
      <div><div class="streak-num">${streak}</div><div style="color:var(--muted);font-size:13px;">${streak===0?'Your streak starts with your first completed task.':'day'+(streak===1?'':'s')+' in a row'}</div></div>
    </div>
  </div>
  `;
}

/* ---------------- CATEGORIES PAGE ---------------- */
function renderCategoriesPage(){
  const counts = {};
  state.tasks.forEach(t=> counts[t.category] = (counts[t.category]||0)+1 );
  return `
  <div class="page-head"><div><h1>Categories</h1><p>Group your tasks the way that makes sense to you.</p></div></div>
  <div class="cat-grid">
    ${state.categories.map(c=>`
      <div class="cat-tile">
        <div class="top"><span class="name">${escapeHtml(c)}</span></div>
        <div class="count">${counts[c]||0} task${(counts[c]||0)===1?'':'s'}</div>
      </div>`).join('')}
    <button class="add-cat-tile" data-action="add-category">${ICONS.plus} New Category</button>
  </div>
  `;
}

/* ---------------- SETTINGS PAGE ---------------- */

  <div class="page-head"><div><h1>Settings</h1><p>Your account and app preferences.</p></div></div>
  <div class="settings-grid">
    <div class="settings-row">

    <div class="settings-row">

      <button class="toggle ${s.focusSound?'on':''}" data-action="toggle-setting" data-key="focusSound"><span class="dot"></span></button>

      <button class="btn btn-ghost btn-sm" data-action="logout">Log out</button>

  </div>
  `;

/* ---------------- MODAL: ADD/EDIT TASK ---------------- */
function renderModal(){
  if(state.modal.type==='task'){
    const editing = state.modal.editingId ? state.tasks.find(t=>t.id===state.modal.editingId) : null;
    const draft = state.modal.draft;
    return `
    <div class="modal-overlay" data-action="close-modal-overlay">
      <div class="modal" data-stop>
        <div class="modal-head">
          <h3>${editing ? 'Edit Task' : 'Create Task'}</h3>
          <button class="modal-close" data-action="close-modal">${ICONS.close}</button>
        </div>
        <form id="task-form">
          <div class="field"><label>Task Title</label><input type="text" name="title" id="mf-title" placeholder="What needs to be done?" value="${escapeHtml(draft.title)}" required></div>
          <div class="field"><label>Description</label><textarea name="description" placeholder="Add some details...">${escapeHtml(draft.description)}</textarea></div>
          <div class="field">
            <label>Priority</label>
            <div class="chip-select" id="priority-chips">
              ${['high','medium','low'].map(p=>`<button type="button" class="chip sel-${p} ${draft.priority===p?'active':''}" data-priority="${p}">${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}
            </div>
          </div>
          <div class="field">
            <label>Category</label>
            <div class="chip-select" id="category-chips">
              ${state.categories.map(c=>`<button type="button" class="chip cat-chip ${draft.category===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label>Due Date</label><input type="date" name="dueDate" value="${draft.dueDate||''}"></div>
            <div class="field"><label>Due Time (optional)</label><input type="time" name="dueTime" value="${draft.dueTime||''}"></div>
          </div>
          <div class="field">
            <label>Tags</label>
            <div class="tag-input-wrap" id="tag-wrap">
              ${(draft.tags||[]).map(tg=>`<span class="tag-chip">#${escapeHtml(tg)}<button type="button" data-remove-tag="${escapeHtml(tg)}">×</button></span>`).join('')}
              <input type="text" id="tag-input" placeholder="Type a tag and press Enter">
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">${editing?'Save Changes':'Create Task'}</button>
          </div>
        </form>
      </div>
    </div>`;
  }
  if(state.modal.type==='category'){
    return `
    <div class="modal-overlay" data-action="close-modal-overlay">
      <div class="modal" data-stop style="max-width:400px;">
        <div class="modal-head"><h3>New Category</h3><button class="modal-close" data-action="close-modal">${ICONS.close}</button></div>
        <form id="cat-form">
          <div class="field"><label>Category name</label><input type="text" name="catname" placeholder="e.g. Fitness" required autofocus></div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Category</button>
          </div>
        </form>
      </div>
    </div>`;
  }
  return '';
}

/* ---------------- FOCUS MODE ---------------- */
function renderFocusMode(){
  const t = state.tasks.find(x=>x.id===state.focusTaskId);
  if(!t) return '';
  const total = state.timer.total;
  const remaining = state.timer.seconds;
  const pct = 1 - remaining/total;
  const circumference = 2*Math.PI*100;
  const offset = circumference * (1-pct);
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  return `
  <div class="focus-overlay">
    <button class="icon-btn fm-close" data-action="close-focus">${ICONS.close}</button>
    <div class="fm-kicker">FOCUS MODE</div>
    <div class="fm-title">${escapeHtml(t.title)}</div>
    ${t.description ? `<div class="fm-desc">${escapeHtml(t.description)}</div>` : `<div class="fm-desc">No description added.</div>`}
    <div class="timer-ring">
      <svg viewBox="0 0 220 220">
        <defs><linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4A003D"/><stop offset="100%" stop-color="#a855c9"/></linearGradient></defs>
        <circle class="bg" cx="110" cy="110" r="100"></circle>
        <circle class="fg" cx="110" cy="110" r="100" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="timer-text"><div class="time">${mm}:${ss}</div><div class="label">${state.timer.running?'FOCUSING':'PAUSED'}</div></div>
    </div>
    <div class="fm-actions">
      <button class="btn btn-ghost" data-action="timer-toggle">${state.timer.running?'Pause':'Resume'}</button>
      <button class="btn btn-ghost" data-action="timer-reset">Reset</button>
      <button class="btn btn-primary" data-action="complete-focus-task" data-id="${t.id}">Complete Task</button>
    </div>
  </div>`;
}

/* ============================================================
   EVENT HANDLING
   ============================================================ */
function attachGlobalListeners(){
  const root = document.getElementById('root');

  root.onclick = (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el){
      // clicking outside modal content closes overlay handled separately
      return;
    }
    const action = el.dataset.action;
    handleAction(action, el, e);
  };

  // auth form
  const authForm = document.getElementById('auth-form');
  if(authForm){
    authForm.addEventListener('submit', handleAuthSubmit);
  }

  // task search live
  const searchInput = document.getElementById('task-search');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.taskSearch = e.target.value; renderKeepingFocus('task-search'); });
  }
  const catFilter = document.getElementById('cat-filter');
  if(catFilter) catFilter.addEventListener('change', e=>{ state.taskCategoryFilter = e.target.value; render(); });
  const sortSelect = document.getElementById('sort-select');
  if(sortSelect) sortSelect.addEventListener('change', e=>{ state.taskSort = e.target.value; render(); });

  // task form
  const taskForm = document.getElementById('task-form');
  if(taskForm){
    taskForm.addEventListener('submit', handleTaskSubmit);
    taskForm.querySelectorAll('#priority-chips .chip').forEach(c=>{
      c.addEventListener('click', ()=>{ state.modal.draft.priority = c.dataset.priority; render(); refocusTagInput(); });
    });
    taskForm.querySelectorAll('#category-chips .chip').forEach(c=>{
      c.addEventListener('click', ()=>{ state.modal.draft.category = c.dataset.cat; render(); });
    });
    const tagInput = document.getElementById('tag-input');
    if(tagInput){
      tagInput.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const v = tagInput.value.trim().replace(/^#/,'');
          if(v && !state.modal.draft.tags.includes(v)){
            state.modal.draft.tags.push(v);
            captureDraftFromForm();
            render();
          } else { tagInput.value=''; }
        }
      });
    }
    taskForm.querySelectorAll('[data-remove-tag]').forEach(b=>{
      b.addEventListener('click', ()=>{
        captureDraftFromForm();
        state.modal.draft.tags = state.modal.draft.tags.filter(t=>t!==b.dataset.removeTag);
        render();
      });
    });
    // preserve text fields on chip clicks by capturing before re-render
    ['title','description'].forEach(name=>{
      const el = taskForm.querySelector(`[name="${name}"]`);
      if(el) el.addEventListener('input', ()=>{ state.modal.draft[name] = el.value; });
    });
    const dd = taskForm.querySelector('[name="dueDate"]');
    if(dd) dd.addEventListener('input', ()=>{ state.modal.draft.dueDate = dd.value; });
    const dt = taskForm.querySelector('[name="dueTime"]');
    if(dt) dt.addEventListener('input', ()=>{ state.modal.draft.dueTime = dt.value; });
  }

  const catForm = document.getElementById('cat-form');
  if(catForm) catForm.addEventListener('submit', handleCategorySubmit);

  // drag & drop for priority columns
  root.querySelectorAll('.task-card[draggable="true"]').forEach(card=>{
    card.addEventListener('dragstart', (e)=>{
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  root.querySelectorAll('.pcol').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', (e)=>{
      e.preventDefault();
      col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const task = state.tasks.find(t=>t.id===id);
      if(task){ task.priority = col.dataset.priority; persistTasks(); render(); toast('Priority updated'); }
    });
  });

  // stop overlay click-through on modal content
  root.querySelectorAll('.modal[data-stop]').forEach(m=> m.addEventListener('click', e=> e.stopPropagation()));

  // esc to close modal / focus
  document.onkeydown = (e)=>{
    if(e.key==='Escape'){
      if(state.focusTaskId){ closeFocusMode(); }
      else if(state.modal){ state.modal=null; render(); }
    }
  };
}

function refocusTagInput(){
  const ti = document.getElementById('tag-input');
  if(ti) setTimeout(()=>ti.focus(), 0);
}

function captureDraftFromForm(){
  const form = document.getElementById('task-form');
  if(!form) return;
  const title = form.querySelector('[name="title"]');
  const desc = form.querySelector('[name="description"]');
  if(title) state.modal.draft.title = title.value;
  if(desc) state.modal.draft.description = desc.value;
}

function renderKeepingFocus(inputId){
  const activeVal = document.getElementById(inputId)?.value;
  const selStart = document.getElementById(inputId)?.selectionStart;
  render();
  const el = document.getElementById(inputId);
  if(el){
    el.focus();
    if(selStart!=null) el.setSelectionRange(selStart, selStart);
  }
}

function handleAction(action, el, e){
  switch(action){
    case 'go-auth':
      state.view='auth'; state.authMode = el.dataset.mode || 'signin'; state.authError=''; render(); break;
    case 'switch-auth':
      state.authMode = el.dataset.mode; state.authError=''; render(); break;
    case 'go-landing':
      state.view='landing'; render(); break;
    case 'nav':
      state.page = el.dataset.page; state.sidebarOpen=false; render(); break;
    case 'toggle-sidebar':
      state.sidebarOpen = !state.sidebarOpen; render(); break;
    case 'close-sidebar':
      state.sidebarOpen = false; render(); break;
    case 'logout':
      doLogout(); break;
    case 'open-add-task':
      openTaskModal(null); break;
    case 'edit-task':
      openTaskModal(el.dataset.id); break;
    case 'delete-task':
      deleteTask(el.dataset.id); break;
    case 'toggle-task':
      toggleTask(el.dataset.id, el); break;
    case 'close-modal':
      state.modal=null; render(); break;
    case 'close-modal-overlay':
      if(e.target.dataset.action==='close-modal-overlay'){ state.modal=null; render(); }
      break;
    case 'set-filter':
      state.taskFilter = el.dataset.filter; render(); break;
    case 'add-category':
      state.modal = {type:'category'}; render(); focusFirstInput(); break;
    case 'toggle-setting':
      state.settings[el.dataset.key] = !state.settings[el.dataset.key]; persistSettings(); render(); break;
    case 'cal-prev':
      state.calCursor.setMonth(state.calCursor.getMonth()-1); render(); break;
    case 'cal-next':
      state.calCursor.setMonth(state.calCursor.getMonth()+1); render(); break;
    case 'cal-view':
      state.calView = el.dataset.view; render(); break;
    case 'cal-day':
      openTaskModal(null, el.dataset.date); break;
    case 'pcol': break;
    case 'start-focus':
      openFocusMode(el.dataset.id); break;
    case 'close-focus':
      closeFocusMode(); break;
    case 'timer-toggle':
      toggleTimer(); break;
    case 'timer-reset':
      resetTimer(); break;
    case 'complete-focus-task':
      completeFocusTask(el.dataset.id); break;
  }
}
function focusFirstInput(){
  setTimeout(()=>{ const i = document.querySelector('.modal input'); if(i) i.focus(); }, 10);
}

/* ---------------- AUTH LOGIC ---------------- */
function handleAuthSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = (fd.get('email')||'').toString().trim().toLowerCase();
  const password = (fd.get('password')||'').toString();
  const users = DB.users();

  if(state.authMode==='signup'){
    const name = (fd.get('name')||'').toString().trim();
    if(!name || !email || !password){ state.authError='Please fill in all fields.'; render(); return; }
    if(users[email]){ state.authError='An account with this email already exists.'; render(); return; }
    const username = email;
    users[email] = {username, email, name, password};
    DB.saveUsers(users);
    loginAs(users[email]);
  } else {
    const rec = users[email];
    if(!rec || rec.password !== password){ state.authError='Incorrect email or password.'; render(); return; }
    loginAs(rec);
  }
}
function loginAs(userRec){
  state.currentUser = {username:userRec.username, email:userRec.email, name:userRec.name};
  DB.setSession(userRec.username);
  loadUserData();
  state.view='app'; state.page='dashboard'; state.authError='';
  render();
}
function doLogout(){
  DB.setSession(null);
  state.currentUser=null; state.view='landing'; state.tasks=[]; state.categories=[];
  render();
}
function loadUserData(){
  state.tasks = DB.tasks(state.currentUser.username);
  state.categories = DB.cats(state.currentUser.username);
  state.settings = DB.settings(state.currentUser.username);
}

/* ---------------- TASK LOGIC ---------------- */
function openTaskModal(id, prefillDate){
  const editing = id ? state.tasks.find(t=>t.id===id) : null;
  state.modal = {
    type:'task',
    editingId: id||null,
    draft: editing ? {
      title:editing.title, description:editing.description||'', priority:editing.priority,
      category:editing.category, dueDate:editing.dueDate||'', dueTime:editing.dueTime||'', tags:(editing.tags||[]).slice()
    } : {
      title:'', description:'', priority:'medium', category: state.categories[0]||'Personal',
      dueDate: prefillDate||'', dueTime:'', tags:[]
    }
  };
  render();
  focusFirstInput();
}
function handleTaskSubmit(e){
  e.preventDefault();
  captureDraftFromForm();
  const d = state.modal.draft;
  if(!d.title.trim()){ return; }
  const fd = new FormData(e.target);
  d.dueDate = fd.get('dueDate') || '';
  d.dueTime = fd.get('dueTime') || '';

  if(state.modal.editingId){
    const t = state.tasks.find(x=>x.id===state.modal.editingId);
    Object.assign(t, {
      title:d.title.trim(), description:d.description.trim(), priority:d.priority,
      category:d.category, dueDate:d.dueDate, dueTime:d.dueTime, tags:d.tags
    });
    toast('Task updated');
  } else {
    state.tasks.unshift({
      id:uid(), title:d.title.trim(), description:d.description.trim(), priority:d.priority,
      category:d.category, dueDate:d.dueDate, dueTime:d.dueTime, tags:d.tags,
      completed:false, completedAt:null, createdAt:new Date().toISOString()
    });
    toast('Task created');
  }
  persistTasks();
  state.modal=null;
  render();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(t=>t.id!==id);
  persistTasks();
  render();
  toast('Task deleted');
}
function toggleTask(id, btnEl){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null;
  persistTasks();
  render();
}

/* ---------------- CATEGORY LOGIC ---------------- */
function handleCategorySubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = (fd.get('catname')||'').toString().trim();
  if(!name) return;
  if(!state.categories.includes(name)){
    state.categories.push(name);
    persistCats();
  }
  state.modal=null;
  render();
  toast('Category added');
}

/* ---------------- FOCUS MODE LOGIC ---------------- */
function openFocusMode(id){
  state.focusTaskId = id;
  state.timer = {running:true, seconds:25*60, total:25*60};
  render();
  startTimerInterval();
}
function closeFocusMode(){
  stopTimerInterval();
  state.focusTaskId = null;
  render();
}
let timerHandle = null;
function startTimerInterval(){
  stopTimerInterval();
  timerHandle = setInterval(()=>{
    if(!state.timer.running) return;
    state.timer.seconds--;
    if(state.timer.seconds<=0){
      state.timer.seconds=0; state.timer.running=false;
      stopTimerInterval();
      toast('Focus session complete');
    }
    updateTimerDisplay();
  }, 1000);
}
function stopTimerInterval(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function updateTimerDisplay(){
  // lightweight partial update to avoid full re-render jank every second
  const timeEl = document.querySelector('.timer-text .time');
  const labelEl = document.querySelector('.timer-text .label');
  const fg = document.querySelector('.timer-ring .fg');
  if(!timeEl) return;
  const remaining = state.timer.seconds, total = state.timer.total;
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  timeEl.textContent = `${mm}:${ss}`;
  if(labelEl) labelEl.textContent = state.timer.running?'FOCUSING':'PAUSED';
  if(fg){
    const circumference = 2*Math.PI*100;
    const pct = 1 - remaining/total;
    fg.setAttribute('stroke-dashoffset', circumference*(1-pct));
  }
}
function toggleTimer(){
  state.timer.running = !state.timer.running;
  render();
}
function resetTimer(){
  state.timer.seconds = state.timer.total;
  state.timer.running = true;
  render();
}
function completeFocusTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(t){ t.completed=true; t.completedAt=new Date().toISOString(); persistTasks(); }
  closeFocusMode();
  toast('Task completed 🎉');
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  const sessionUser = DB.session();
  if(sessionUser){
    const users = DB.users();
    const rec = users[sessionUser];
    if(rec){
      state.currentUser = {username:rec.username, email:rec.email, name:rec.name};
      loadUserData();
      state.view='app';
    } else {
      DB.setSession(null);
    }
  }
  render();
}
boot();

})();
</script>
